# nginx serving the built single-page app.
#
# TLS termination and the plain-HTTP redirect (Requirement 20.1) happen at the ingress / load
# balancer in front of this container in the cloud topology; see `infra/README.md`. Where this
# container terminates TLS itself instead, uncomment the redirect server below and point the TLS
# server at the certificate. The security response headers are set here so they cover the static
# assets and the entry document the front end is served from; the API sets its own (see
# `backend/app/core/security_headers.py`).

# --- Optional: redirect plain HTTP to HTTPS when this container terminates TLS ------------------
# server {
#     listen 80;
#     server_name _;
#     return 308 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hardening headers on every response (Requirement 20.9). HSTS is only emitted when TLS is in
    # front (the ingress adds it, or uncomment it here when this server terminates TLS), because
    # pinning a browser to HTTPS over a plain-HTTP dev server is a footgun.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Location is refused the capability outright (Requirement 20.10); the camera is allowed to the
    # app's own origin for the QR scanner (Requirement 23.8).
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    # A conservative CSP for the SPA: same-origin scripts and styles, images from self and data URIs
    # (the QR preview), API calls to self (the ingress proxies /api), and nothing framed.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Hashed assets are immutable; the entry document is not.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page application: unknown paths are client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
